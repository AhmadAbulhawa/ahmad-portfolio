name: Stable cinematic handoff experiment
on:
  push:
    branches: ['fix/cinematic-frame-alignment']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  visual:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Test real mobile and desktop film progression
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: |
          node scripts/serve-export.mjs > /tmp/stable-film.log 2>&1 &
          node scripts/qa-stable-deck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-film-${{ matrix.browser }}
          path: work/stable-frames
          if-no-files-found: warn
