name: Cinematic mobile visual QA
on:
  push:
    branches: [portfolio-3d-v2]
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test mobile and desktop rendering
        run: |
          python3 -m http.server 3000 --directory out >/tmp/preview-server.log 2>&1 &
          sleep 3
          node scripts/qa-firnlight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firnlight-mobile-desktop-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
